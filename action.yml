name: 'AquaSec Scan Results'
description: 'Process and handle AquaSec security scan results for GitHub Security tab integration'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  aqua-key:
    description: 'AquaSec API Key'
    required: true
  aqua-secret:
    description: 'AquaSec API Secret'
    required: true
  group-id:
    description: 'AquaSec Group ID for authentication'
    required: true
  repository-id:
    description: 'AquaSec Repository ID (UUID format)'
    required: true
  verbose-logging:
    description: 'Enable or disable verbose logging'
    required: false
    default: 'false'
  dev-branch-comparison:
    description: 'Enable developer branch comparison modes'
    required: false
    default: 'false'

outputs:
  nightscan-sarif-file:
    description: 'Full path to the generated SARIF file from the night scan'
    value: ${{ steps.aquasec-scan-results.outputs.nightscan-sarif-file }}
  comparison-sarif-file:
    description: 'Full path to the generated SARIF file with new security findings from branch comparison'
    value: ${{ steps.aquasec-scan-results.outputs.comparison-sarif-file }}
  comparison-summary-file:
    description: 'Full path to the comparison summary file'
    value: ${{ steps.aquasec-scan-results.outputs.comparison-summary-file }}

runs:
  using: 'composite'
  steps:
    - name: Install Python dependencies
      run: |
        python3 -m pip install -r ${{ github.action_path }}/requirements.txt
      shell: bash

    - name: Prepare environment variables
      run: |
        echo "::add-mask::${{ inputs.aqua-key }}"
        echo "::add-mask::${{ inputs.aqua-secret }}"
        echo "::add-mask::${{ inputs.group-id }}"
        echo "::add-mask::${{ inputs.repository-id }}"
        echo "INPUT_AQUA_KEY=${{ inputs.aqua-key }}" >> $GITHUB_ENV
        echo "INPUT_AQUA_SECRET=${{ inputs.aqua-secret }}" >> $GITHUB_ENV
        echo "INPUT_GROUP_ID=${{ inputs.group-id }}" >> $GITHUB_ENV
        echo "INPUT_REPOSITORY_ID=${{ inputs.repository-id }}" >> $GITHUB_ENV
        echo "INPUT_VERBOSE_LOGGING=${{ inputs.verbose-logging }}" >> $GITHUB_ENV
        echo "INPUT_DEV_BRANCH_COMPARISON=${{ inputs.dev-branch-comparison }}" >> $GITHUB_ENV
      shell: bash

    - name: Run AquaSec Scan Results action
      id: aquasec-scan-results
      env:
        INPUT_AQUA_KEY: ${{ env.INPUT_AQUA_KEY }}
        INPUT_AQUA_SECRET: ${{ env.INPUT_AQUA_SECRET }}
        INPUT_GROUP_ID: ${{ env.INPUT_GROUP_ID }}
        INPUT_REPOSITORY_ID: ${{ env.INPUT_REPOSITORY_ID }}
        INPUT_VERBOSE_LOGGING: ${{ env.INPUT_VERBOSE_LOGGING }}
        INPUT_DEV_BRANCH_COMPARISON: ${{ env.INPUT_DEV_BRANCH_COMPARISON }}
      run: |
        export PYTHONPATH="${PYTHONPATH}:${{ github.action_path }}"
        python3 ${{ github.action_path }}/main.py
      shell: bash
