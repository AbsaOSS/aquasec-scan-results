name: Security Alerts to Issues

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  security-events: read

jobs:
  security-alerts-to-issues:
    name: Security Alerts to Issues
    runs-on: ubuntu-latest

    steps:
      - name: Checkout external sync scripts
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          repository: absa-group/cps-qa
          ref: feature/security-alert-issues-automation
          path: cps_qa
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install external script dependencies
        run: |
          pip install -r cps_qa/requirements.txt

      - name: Run alert-to-issue sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 cps_qa/promote_alerts.py
