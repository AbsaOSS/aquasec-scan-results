# It delegates to the remove-adept-to-close-on-issue-close.yml reusable workflow in the organizational-workflows repo.

name: Remove adept to close on issue close

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  remove-label:
    uses: AbsaOSS/organizational-workflows/.github/workflows/remove-adept-to-close-on-issue-close.yml@f536889ebc386c1380068e31d5c68a8f5ea6bbf6
